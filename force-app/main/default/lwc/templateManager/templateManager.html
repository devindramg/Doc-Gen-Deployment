<!--
@description       : LWC to manage Document Templates, showing an editor in a modal popup.
@author            : Anara AI
@last modified on  : 12-04-2025
-->
<template>
    <lightning-card title="Document Template Manager" icon-name="standard:document_template">
        <lightning-button label="New Template" slot="actions" onclick={handleNew}></lightning-button>

        <div class="slds-p-around_medium">
            <lightning-datatable 
                key-field="Id" 
                data={templates} 
                columns={columns}
                onrowselection={handleRowSelection} 
                selected-rows={selectedRows}
                max-row-selection="1" 
                is-loading={isLoading}>
            </lightning-datatable>
        </div>
    </lightning-card>

    <!-- Modal for New/Edit Template -->
    <template if:true={isEditing}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{modalHeaderText}</h2>
                </header>
                
                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <c-template-editor 
                        template-record={selectedTemplate} 
                        onsave={handleSave} 
                        oncancel={handleCancel}>
                    </c-template-editor>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
